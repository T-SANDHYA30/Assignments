<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-shadow: 2px 2px 4px rgb(134, 218, 95);
        }
        .box{
            width:50%;
            height:50%;
            box-shadow: 5px 5px 15px rgb(102, 232, 255);
        }
        .grd{
            background: linear-gradient(to right, rgb(160, 160, 223),rgb(57, 57, 216),rgb(7, 7, 240));
        }
        .rgrd{
            background: radial-gradient(circle farthest-corner, rgb(160, 160, 223),rgb(178, 82, 187),rgb(91, 148, 89));
        }

        .cgrd{
            background: conic-gradient(rgb(56, 204, 214),rgb(202, 86, 140),rgb(157, 219, 86));
        }
    </style>
</head>
<body class="cgrd">
    <h1 class="box">Shadowing in CSS</h1>
</body>
</html>
