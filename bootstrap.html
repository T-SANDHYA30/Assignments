<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body>
    <div class="container-sm" style="width: 40%;">
        <h1 class="text-center text-capitalize bg-info">Demo Form</h1>
        <form>
            <div class="row">
                <label class="col-3 form-label">Text</label>
                <div class="col-9">
                    <input type="text" class="form-control" placeholder="enter text">
                </div>
            </div>
            <div class="row">
                <label class="col-3 form-label">Selection</label>
                <div class="col-9">
                    <select class="form-select">
                        <option>Option1</option>
                        <option>Option2</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <label class="col-3" name="chk">Checkbox</label>
                <div class="col-9">
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input" id="inlineCheckbox1" value="val1">
                        <label class="form-check-label">val1</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input" id="inlineCheckbox2" value="val2">
                        <label class="form-check-label">val2</label>
                    </div>
                </div>

                <div class="row">
                    <lable class="col-3" name="chk">options</lable>
                    <div class="col-9">
                        <ul class="list-group">
                            <li class="list-group-item">li1</li>
                            <li class="list-group-item">li2</li>
                            <li class="list-group-item">li3</li>
                        </ul>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
