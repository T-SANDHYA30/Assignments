<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
        <form>
            <caption>PG Accomodation Form</caption>
            <fieldset>
                <legend>Personal Details</legend>
                <label for="fname">Full Name </label><input type="text" id="fname" name="fname"><br>
                <label for="num">Mobile Number</label><input type="num" id="num" name="num"><br>
                <label for="mail">Email</label><input type="mail" id="mail" name="mail"><br>
            </fieldset>
            <fieldset>
                <legend>Pg Details</legend>
                <label for="cname">City</label><input type="text" id="cname" name="cname"><br>
                <label for="beds">Room Type</label><select id="beds" name="beds">
                    <option></option>
                    <option value="Single Sharing">Single Sharing</option>
                    <option value="Double Sharing">Double Sharing</option>
                </select>
                <label for="fac">Facillities</label><select id="fac" name="fac">
                    <option></option>
                    <option value="Wifi">Wifi</option>
                    <option value="Ac">Ac</option>
                    <option value="fridge">Fridge</option>
                    <option value="laundry">Laundry</option>
                </select>
                <label for="amount">Rent</label><input type="range" name="amount">
                <select>
                <option></option>
                <option value="2000">2000</option>
                <option value="3000">3000</option>
                <option value="4000">4000</option>
                </select>   
            </fieldset>
            <fieldset>
                <legend>Address</legend>
                <label for="addr">Address</label><input type="text" id="addr" name="addr"><br>
                <label for="caddr">City</label><input type="text" id="caddr" name="caddr"><br>
                <label for="saddr">State</label><input type="text" id="saddr" name="saddr"><br>
            </fieldset>
            <fieldset>
                <legend>Documents</legend>
                <label for="verify">Update Id Proof</label>
                <input type="file" id="verfiy" name="verify" accept=".pdf,.doc*">

            </fieldset>
            <fieldset>
                <legend>Payment</legend>
                <label for="Paymnet">Payment Type</label><select id="Payment" name="Payment">
                    <option></option>
                    <option value="P Pay">Phone Pay</option>
                    <option value="G Pay">Google Pay</option>
                    <option value="D cash">Cash</option>
                </select>
            </fieldset>
            <tr>
                <td colspan="50" align="centre" class="btn1">
                    <button>Submit</button>
                </td>
                <td colspan="50" align="centre" class="btn1">
                    <button>Reset</button>
                </td>
            </tr>

</body>

</html>
