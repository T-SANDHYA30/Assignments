<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formstyle.css">
    <script src="formdata.js"></script>
</head>

<body>
    
    <table border="3" align="center" cellpadding="10" cellspacing="10">
        <!--Cellpadding - space between data in box and box ;  CellSpacing - space between boxes-->
        <caption>Registration form</caption>
        <form>
            <tr>
                <th class="label">Id</th>
                <td><input type="number" id="uid" name="uid"></td>
            </tr>
            <tr>
                <th class="label">Name</th>
                <td><input type="text" id="uname" name="uname"></td>
            </tr>
            <tr>
                <th class="label">Password</th>
                <td><input type="text" id="pwd" name="pwd"></td>
            </tr>
            <tr>
                <th class="label">Confirm Password</th>
                <td><input type="text" id="cpwd" name="cpwd"></td>
            </tr>
            <tr>
                <th class="label">mobile</th>
                <td><input type="mobile" id="mob" name="mob"></td>
            </tr>
            <tr>
                <th class="label">email</th>
                <td><input type="email" id="email" name="email"></td>
            </tr>
            <!-- <tr>
                <th class="label">Gender</th>
                <td>
                    <label for="gend">Gender</label>
                    <select id="gend" name="gend">
                        <option></option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </td>
            </tr>-->

            <!-- gender using radio button -->
            <label for="skill">SkillSet</label>
            Female<input type="radio" id="gend" name="gend" value="Female">
            Male<input type="radio" id="gend" name="gend" value="Male">

            <tr>
                <th class="label">SkillSet</th>
                <td>
                    <label class="custom-checkbox" for="skill">
                        Java<input type="checkbox" name="skill" value="java">
                        Spring<input type="checkbox" name="skill" value="Spring">
                        Python<input type="checkbox" name="skill" value="Python">
                        C<input type="checkbox" name="skill" value="C">
                    </label>
                </td>
            </tr>

            </tr>
            <tr>
                <th class="label">Qualification</th>
                <td>
                    <label for="qual">Qualification</label>
                    <select id="qual" name="qual">
                        <option></option>
                        <option value="M.Tech">M.Tech</option>
                        <option value="B.Tech">B.tech</option>
                        <option value="M.B.A">M.B.A</option>
                    </select>
                </td>
            </tr>
            <tr>
                <th class="label">Photo</th>
                <td>
                    <label for="pic">Update Photo</label>
                    <input type="file" id="pic" name="pic" accept=".pdf,.doc*">
                </td>
            </tr>
            <tr>
                <th class="label">Resume</th>
                <td>
                    <label for="res">Update Resume</label>
                    <input type="file" id="res" name="res" accept=".pdf,.doc*">
                </td>
            </tr>

            <!--<tr>
                <td colspan="50" align="centre">
                    <button class="btn1">Submit</button>
                    <button class="btn2">Reset</button>
                </td>
            </tr>-->
            <input type="Submit" value="submit" accesskey="" onclick="signup()"> 
    
        </form>
</body>

</html>
