spring.application.name=Ecomerce-App
server.port=8072
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/springg
spring.datasource.username=root
spring.datasource.password=root@39
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql= true

#Logging properties
logging.level.root=INFO
logging.level.com.project=debug
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} %msg%n
logging.file.name=logs/itemapp.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} %msg%n

#management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.include=heapdump
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator