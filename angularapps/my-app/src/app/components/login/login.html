<div class="border border-3 border-dark mt-5 mb-5" style="width: 400px;">
    <h3 class="text-primary">{{appName}}</h3>
    <form class="p-4">
        <div>
            <label class="form-label" for="uname">User Name</label>
            <input class="form-control" id="uname" name="uname" [(ngModel)]="uname">
        </div>
        <div>
            <label class="form-label" for="pwd">Password</label>
            <input class="form-control" id="pwd" name="pwd" [(ngModel)]="pwd">
        </div>
        <div>
            <button class="btn btn-outline-primary mt-2" (click)="login()">Submit</button>
        </div>
        

    </form>
</div>
