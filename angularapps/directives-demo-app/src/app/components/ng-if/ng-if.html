<p>ng-if works!</p>
<div>
    <h1>ngIf Demo</h1>
    <button class="btn btn-primary" (click)="login()">{{isLoggedIn?"logogut":"login"}}</button>
    <!--<h3 *ngIf="isLoggedIn">Welcome {{uname}}</h3>-->
    <h3 *ngIf="isLoggedIn;else elseblock"></h3>
    <ng-template #elseblock>
        <h3>{{uname}},Thank you, Visit Again....</h3>
    </ng-template>
</div>
